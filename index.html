<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding-top:60px;
    position:relative;
    z-index:2;
}
.logo{
    font-size:70px;
    font-weight:bold;
}
.logo img{
    filter:
    drop-shadow(0 0 6px white)

}

.slogan{
    letter-spacing:4px;
    margin-top:25px;
    margin-bottom:50px;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(3,220px);
    gap:20px;
    justify-content:center;
}

.btn{
    padding:20px;
    border-radius:10px;
    font-size:28px;
    font-weight:900;
    font-style:italic;
    text-decoration:none;
    transition:all .3s ease;

    display:flex;
    justify-content:center;
    align-items:center;
    
    white-space: nowrap;

}
.btn:hover{
    transform:scale(1.1) translateY(-8px);
    box-shadow:
    0 0 20px rgba(255,255,255,.5),
    0 0 40px rgba(255,255,255,.25);
}

.mtv80s{
    background:#ff1493;
    color:#66ffff;
}

.mtv90s{
    background:#ffd800;
    color:red;
}

.mtv00s{
    background:#ffb6d9;
    color:black;
}

.hits{
    background:#c9a0ff;
    color:black;
}

.music{
    background:#e8ff3b;
    color:black;
}

.latino{
    background:orange;
    color:black;
}

.mtv80s:hover{
    box-shadow:
    0 0 20px #ff1493,
    0 0 40px #ff1493;
}

.mtv90s:hover{
    box-shadow:
    0 0 20px #ffd800,
    0 0 40px #ffd800;
}

.mtv00s:hover{
    box-shadow:
    0 0 20px #ffb6d9,
    0 0 40px #ffb6d9;
}

.hits:hover{
    box-shadow:
    0 0 20px #c9a0ff,
    0 0 40px #c9a0ff;
}

.music:hover{
    box-shadow:
    0 0 20px #e8ff3b,
    0 0 40px #e8ff3b;
}

.latino:hover{
    box-shadow:
    0 0 20px orange,
    0 0 40px orange;
}

.btn:active{
    transform:scale(0.96);
}

.shape{
    position:absolute;
    opacity:.45;
    animation:float 12s infinite alternate;
   filter: drop-shadow(0 0 8px currentColor);
}

.shape1{
    top:10%;
    left:10%;
    color:#ff1493;
    font-size:40px;
}

.shape2{
    top:20%;
    right:15%;
    color:#00ffff;
    font-size:50px;
}

.shape3{
    bottom:20%;
    left:20%;
    color:#ffd800;
    font-size:60px;
}

.shape4{
    bottom:15%;
    right:15%;
    color:orange;
    font-size:45px;
}

@keyframes float{
    0%{
        transform:translate(0px,0px) rotate(0deg);
    }

    25%{
        transform:translate(20px,-15px) rotate(8deg);
    }

    50%{
        transform:translate(-15px,20px) rotate(-8deg);
    }

    75%{
        transform:translate(15px,10px) rotate(5deg);
    }

    100%{
        transform:translate(-20px,-15px) rotate(-5deg);
    }
}
#mtv80s-page{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:#000;
    z-index:999;
    overflow:hidden;
}

    top:20px;

}

.mini-forever{

}

.mini-forever img{

}

.screen80s{

}

}
.player{
    position:relative;
    z-index:10;
}
#videoPlayer{
    position:absolute;
    top:0;
    left:0;

.shape2{

.shape3{

.p1{ bottom:0; right:0; }

.small-circle{

    border:4px solid #ff1493;

        0 0 22px #ff1493;
}

.spark{
    position:absolute;

    width:7px;
    height:7px;

    background:#ff4fd8;

    transform:rotate(45deg);

    box-shadow:
        0 0 8px #ff4fd8,
        0 0 16px #ff4fd8;

    animation:twinkle 4s ease-in-out infinite;
}

.spark::before,
.spark::after{
    content:"";
    position:absolute;
    background:inherit;
}

.spark::before{
    width:2px;
    height:16px;
    left:2.5px;
    top:-4px;
}

.spark::after{
    width:16px;
    height:2px;
    left:-4px;
    top:2.5px;
}

.s1{ left:40px; top:40px; }

.s2{ left:180px; top:120px; }

.s3{ left:900px; top:50px; }

.s4{ right:80px; top:60px; }

.s5{ right:40px; top:260px; }

.s6{ left:60px; bottom:380px; }

.s7{ left:380px; bottom:340px; }

.s8{ right:60px; bottom:380px; }

.s9{ left:720px; top:320px; }

.s10{ right:420px; bottom:120px; }

.s11{ left:120px; bottom:120px; }

.s12{ right:180px; bottom:80px; }
    
@keyframes twinkle{

    0%,100%{
        opacity:.5;
        transform:rotate(45deg) scale(1);
    }

    50%{
        opacity:1;
        transform:rotate(45deg) scale(1.3);
    }
}

.retro-grid{
    position:absolute;
    bottom:-460px;
    left:50%;

    width:2200px;
    height:900px;

    transform:

        transparent 70px

    repeating-linear-gradient(
        0deg,
        rgba(0,255,255,.8) 0px,
        rgba(0,255,255,.8) 2px,
        transparent 2px,
        transparent 70px
    );
  filter:
  drop-shadow(0 0 6px #ff1493)
  drop-shadow(0 0 6px #00ffff);

  box-shadow:none;
 }   
.retro-grid::before{
    content:"";
    position:absolute;
    inset:0;

    background:radial-gradient(
        ellipse at center,
        transparent 45%,
        rgba(0,0,0,.5) 75%,
        #000 100%
    );

    pointer-events:none;
}
