<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTV FOREVER</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding-top:60px;
    position:relative;
    z-index:2;
}
.logo{
    font-size:70px;
    font-weight:bold;
}
.logo img{
    filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 20px rgba(255,255,255,.7))
    drop-shadow(0 0 35px rgba(255,255,255,.3));
}

.slogan{
    letter-spacing:4px;
    margin-top:25px;
    margin-bottom:50px;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(3,220px);
    gap:20px;
    justify-content:center;
}

.btn{
    padding:20px;
    border-radius:10px;
    font-size:28px;
    font-weight:900;
    font-style:italic;
    text-decoration:none;
    transition:all .3s ease;

    display:flex;
    justify-content:center;
    align-items:center;
    
    white-space: nowrap;

}
.btn:hover{
    transform:scale(1.1) translateY(-8px);
    box-shadow:
    0 0 20px rgba(255,255,255,.5),
    0 0 40px rgba(255,255,255,.25);
}

.mtv80s{
    background:#ff1493;
    color:#66ffff;
}

.mtv90s{
    background:#ffd800;
    color:red;
}

.mtv00s{
    background:#ffb6d9;
    color:black;
}

.hits{
    background:#c9a0ff;
    color:black;
}

.music{
    background:#e8ff3b;
    color:black;
}

.latino{
    background:orange;
    color:black;
}

.mtv80s:hover{
    box-shadow:
    0 0 20px #ff1493,
    0 0 40px #ff1493;
}

.mtv90s:hover{
    box-shadow:
    0 0 20px #ffd800,
    0 0 40px #ffd800;
}

.mtv00s:hover{
    box-shadow:
    0 0 20px #ffb6d9,
    0 0 40px #ffb6d9;
}

.hits:hover{
    box-shadow:
    0 0 20px #c9a0ff,
    0 0 40px #c9a0ff;
}

.music:hover{
    box-shadow:
    0 0 20px #e8ff3b,
    0 0 40px #e8ff3b;
}

.latino:hover{
    box-shadow:
    0 0 20px orange,
    0 0 40px orange;
}

.btn:active{
    transform:scale(0.96);
}

.shape{
    position:absolute;
    opacity:.45;
    animation:float 12s infinite alternate;
   filter: drop-shadow(0 0 8px currentColor);
}

.shape1{
    top:10%;
    left:10%;
    color:#ff1493;
    font-size:40px;
}

.shape2{
    top:20%;
    right:15%;
    color:#00ffff;
    font-size:50px;
}

.shape3{
    bottom:20%;
    left:20%;
    color:#ffd800;
    font-size:60px;
}

.shape4{
    bottom:15%;
    right:15%;
    color:orange;
    font-size:45px;
}

@keyframes float{
    0%{
        transform:translate(0px,0px) rotate(0deg);
    }

    25%{
        transform:translate(20px,-15px) rotate(8deg);
    }

    50%{
        transform:translate(-15px,20px) rotate(-8deg);
    }

    75%{
        transform:translate(15px,10px) rotate(5deg);
    }

    100%{
        transform:translate(-20px,-15px) rotate(-5deg);
    }
}
#mtv80s-page{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:#000;
    z-index:999;
    overflow:hidden;
}

.home-btn{
    position:absolute;
    top:20px;
    right:30px;

    padding:8px 18px;

    border:2px solid #ff1493;
    border-radius:20px;

    background:black;
    color:#ff1493;

    font-weight:bold;
    cursor:pointer;

    box-shadow:
    0 0 10px #ff1493,
    0 0 20px #ff1493;
}

.mini-forever{
    position:absolute;
    top:15px;
    left:40px;

    display:flex;
    align-items:center;
    gap:6px;

    transform:none;
}

.mini-forever img{
    width:50px;
}

.mini-forever span{
    color:#66ffff;
    font-size:20px;
    font-weight:900;
    font-style:italic;

    text-shadow:
    0 0 5px #66ffff,
    0 0 10px #66ffff;
}
.logo80s{
    text-align:center;
    margin-top:45px;
}
.logo80s img{
    width:190px;

    filter:
    drop-shadow(0 0 15px #00ffff)
    drop-shadow(0 0 30px #00ffff);
}


.player80s{
    width:720px;
    height:400px;

    margin-top:15px;
    margin-left:auto;
    margin-right:auto;


    padding:6px;

    background:linear-gradient(
        90deg,
        #ff1493,
        #00ffff
    );

    box-shadow:
    0 0 25px #ff1493,
    0 0 50px #00ffff;

    position:relative;
    z-index:20;
}

.screen80s{
    width:100%;
    height:100%;

    background:black;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#ffffff;

    font-size:35px;
    font-weight:bold;
}


.player{
    position:relative;
    z-index:10;
}
.circle-left,
.circle-right{
    position:absolute;
    border-radius:50%;
}

.circle-left{
    width:110px;
    height:110px;
    left:70px;
    top:180px;

    border:7px solid #00ffff;

    box-shadow:
    0 0 25px #00ffff,
    0 0 50px #00ffff;
}

.circle-right{
    width:110px;
    height:110px;
    right:70px;
    top:180px;

    border:7px solid #ff1493;

    box-shadow:
    0 0 25px #ff1493,
    0 0 50px #ff1493;
}
.star80{
    position:absolute;
    top:140px;
    right:250px;

    color:#ff1493;
    font-size:28px;

    text-shadow:
    0 0 10px #ff1493,
    0 0 20px #ff1493;
}

.star80::before{
    content:"✦";
}
.player80s{
    position:relative;
    z-index:20;
}
.shape1{
    position:absolute;
    left:80px;
    top:90px;

    width:45px;
    height:45px;

    border:4px solid #ff1493;

    transform:rotate(45deg);

    box-shadow:0 0 20px #ff1493;
}

.shape2{
    position:absolute;
    right:340px;
    top:520px;
    width:30px;
    height:30px;
    border:4px solid #00ffff;
    transform:rotate(45deg);
    box-shadow:0 0 20px #00ffff;
}

.shape3{
    position:absolute;
    right:190px;
    top:500px;
    width:70px;
    height:5px;
    background:#ffd800;
    transform:rotate(-45deg);
    box-shadow:0 0 20px #ffd800;
}

.shape4{
    position:absolute;
    right:230px;
    top:150px;
    color:#ff1493;
    font-size:35px;
    text-shadow:0 0 20px #ff1493;
}

.shape4::before{
    content:"✦";
}
.shape5{
    position:absolute;
    left:90px;
    bottom:330px;

    color:#ff1493;
    font-size:55px;

    text-shadow:0 0 20px #ff1493;
}

.shape5::before{
    content:"△";
}

.shape6{
    position:absolute;
    right:200px;
    top:120px;

    width:12px;
    height:12px;

    background:#00ffff;

    border-radius:50%;

    box-shadow:
    0 0 15px #00ffff,
    0 0 30px #00ffff;
}
.retro-grid{
    position:absolute;
    bottom:-460px;
    left:50%;

    width:2200px;
    height:900px;

    transform:
    translateX(-50%)
    perspective(1000px)
    rotateX(63deg);

    z-index:1;

    overflow:hidden;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,20,147,.8) 0px,
        rgba(255,20,147,.8) 2px,
        transparent 2px,
        transparent 70px
    ),
    repeating-linear-gradient(
        0deg,
        rgba(0,255,255,.8) 0px,
        rgba(0,255,255,.8) 2px,
        transparent 2px,
        transparent 70px
    );
  filter:
  drop-shadow(0 0 6px #ff1493)
  drop-shadow(0 0 6px #00ffff);

  box-shadow:none;
 }   
.retro-grid::before{
    content:"";
    position:absolute;
    inset:0;

    background:radial-gradient(
        ellipse at center,
        transparent 45%,
        rgba(0,0,0,.5) 75%,
        #000 100%
    );

    pointer-events:none;
}
</style>
</head>

<script>

const boton80s = document.querySelector(".mtv80s");

boton80s.onclick = function(e){

    e.preventDefault();

    document.getElementById("home").style.display = "none";

    document.getElementById("mtv80s-page").style.display = "block";

};

document.querySelector(".home-btn").onclick = function(){

    document.getElementById("home").style.display = "block";

    document.getElementById("mtv80s-page").style.display = "none";

};
