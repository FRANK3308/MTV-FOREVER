<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTV FOREVER</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding-top:60px;
    position:relative;
    z-index:2;
}
.logo{
    font-size:70px;
    font-weight:bold;
}
.logo img{
    filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 20px rgba(255,255,255,.7))
    drop-shadow(0 0 35px rgba(255,255,255,.3));
}

.slogan{
    letter-spacing:4px;
    margin-top:25px;
    margin-bottom:50px;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(3,220px);
    gap:20px;
    justify-content:center;
}

.btn{
    padding:20px;
    border-radius:10px;
    font-size:28px;
    font-weight:900;
    font-style:italic;
    text-decoration:none;
    transition:all .3s ease;

}
.btn:hover{
    transform:scale(1.1) translateY(-8px);
    box-shadow:
    0 0 20px rgba(255,255,255,.5),
    0 0 40px rgba(255,255,255,.25);
}

.mtv80s{
    background:#ff1493;
    color:#66ffff;
}

.mtv90s{
    background:#ffd800;
    color:red;
}

.mtv00s{
    background:#ffb6d9;
    color:black;
}

.hits{
    background:#c9a0ff;
    color:black;
}

.music{
    background:#e8ff3b;
    color:black;
}

.latino{
    background:orange;
    color:black;
}

.mtv80s:hover{
    box-shadow:
    0 0 20px #ff1493,
    0 0 40px #ff1493;
}

.mtv90s:hover{
    box-shadow:
    0 0 20px #ffd800,
    0 0 40px #ffd800;
}

.mtv00s:hover{
    box-shadow:
    0 0 20px #ffb6d9,
    0 0 40px #ffb6d9;
}

.hits:hover{
    box-shadow:
    0 0 20px #c9a0ff,
    0 0 40px #c9a0ff;
}

.music:hover{
    box-shadow:
    0 0 20px #e8ff3b,
    0 0 40px #e8ff3b;
}

.latino:hover{
    box-shadow:
    0 0 20px orange,
    0 0 40px orange;
}

.btn:active{
    transform:scale(0.96);
}

.shape{
    position:absolute;
    opacity:.45;
    animation:float 12s infinite alternate;
   filter: drop-shadow(0 0 8px currentColor);
}

.shape1{
    top:10%;
    left:10%;
    color:#ff1493;
    font-size:40px;
}

.shape2{
    top:20%;
    right:15%;
    color:#00ffff;
    font-size:50px;
}

.shape3{
    bottom:20%;
    left:20%;
    color:#ffd800;
    font-size:60px;
}

.shape4{
    bottom:15%;
    right:15%;
    color:orange;
    font-size:45px;
}

@keyframes float{
    0%{
        transform:translate(0px,0px) rotate(0deg);
    }

    25%{
        transform:translate(20px,-15px) rotate(8deg);
    }

    50%{
        transform:translate(-15px,20px) rotate(-8deg);
    }

    75%{
        transform:translate(15px,10px) rotate(5deg);
    }

    100%{
        transform:translate(-20px,-15px) rotate(-5deg);
    }
}
</style>
</head>

<body>
