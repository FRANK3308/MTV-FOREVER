<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTV FOREVER</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding-top:60px;
    position:relative;
    z-index:2;
}
.logo{
    font-size:70px;
    font-weight:bold;
}
.logo img{
    filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 20px rgba(255,255,255,.7))
    drop-shadow(0 0 35px rgba(255,255,255,.3));
}

.slogan{
    letter-spacing:4px;
    margin-bottom:50px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,220px);
    gap:20px;
    justify-content:center;
}

.btn{
    padding:20px;
    border-radius:10px;
    font-size:28px;
    font-weight:bold;
    text-decoration:none;
    transition:.3s;
}
.btn:hover{
    transform:scale(1.1) translateY(-8px);
    box-shadow:
    0 0 20px rgba(255,255,255,.5),
    0 0 40px rgba(255,255,255,.25);
}

.mtv80s{
    background:#ff1493;
    color:#66ffff;
}

.mtv90s{
    background:#ffd800;
    color:red;
}

.mtv00s{
    background:#ffb6d9;
    color:black;
}

.hits{
    background:#c9a0ff;
    color:black;
}

.music{
    background:#e8ff3b;
    color:black;
}

.latino{
    background:orange;
    color:black;
}

.shape{
    position:absolute;
    opacity:.45;
    animation:float 8s ease-in-out infinite alternate;
    pointer-events:none;
}

.shape1{
    top:10%;
    left:10%;
    color:#ff1493;
    font-size:40px;
}

.shape2{
    top:20%;
    right:15%;
    color:#00ffff;
    font-size:50px;
}

.shape3{
    bottom:20%;
    left:20%;
    color:#ffd800;
    font-size:60px;
}

.shape4{
    bottom:15%;
    right:15%;
    color:orange;
    font-size:45px;
}

@keyframes float{
    0%{
        transform:translate(0px,0px) rotate(0deg);
    }

    25%{
        transform:translate(20px,-15px) rotate(8deg);
    }

    50%{
        transform:translate(-15px,20px) rotate(-8deg);
    }

    75%{
        transform:translate(15px,10px) rotate(5deg);
    }

    100%{
        transform:translate(-20px,-15px) rotate(-5deg);
    }
}
</style>
</head>

<body>

<div class="shape shape1">△</div>
<div class="shape shape2">○</div>
<div class="shape shape3">◇</div>
<div class="shape shape4">✦</div>

<div class="shape" style="top:8%;left:35%;color:#00ffff;font-size:80px;">╱</div>

<div class="shape" style="top:5%;right:12%;color:#ffd800;font-size:85px;">╲</div>

<div class="shape" style="top:35%;left:5%;color:#00ffff;font-size:45px;">○</div>

<div class="shape" style="top:48%;right:7%;color:#ff1493;font-size:60px;">✦</div>

<div class="shape" style="bottom:25%;left:3%;color:#ffd800;font-size:55px;">◇</div>

<div class="shape" style="bottom:8%;left:8%;color:#ff1493;font-size:95px;">△</div>

<div class="shape" style="bottom:12%;right:5%;color:#00ffff;font-size:70px;">◇</div>

<div class="shape" style="bottom:2%;right:25%;color:#ffd800;font-size:55px;">✦</div>

<div class="shape" style="bottom:4%;left:60%;color:#00ffff;font-size:90px;">╱</div>

<div class="shape" style="top:65%;right:22%;color:#ff1493;font-size:40px;">○</div>
<div class="shape" style="top:2%;left:3%;color:#ff1493;font-size:25px;">○</div>
<div class="shape" style="top:6%;left:7%;color:#00ffff;font-size:55px;">╱</div>

<div class="shape" style="top:12%;right:15%;color:#ff1493;font-size:18px;">○</div>

<div class="shape" style="bottom:18%;left:4%;color:#ff1493;font-size:60px;">✦</div>

<div class="shape" style="bottom:18%;right:8%;color:#00ffff;font-size:20px;">○</div>
<div class="shape" style="top:10%;left:20%;color:#ff1493;font-size:18px;">○</div>

<div class="shape" style="top:15%;left:60%;color:#00ffff;font-size:15px;">○</div>

<div class="shape" style="top:25%;right:25%;color:#ffd800;font-size:20px;">✦</div>

<div class="shape" style="top:32%;left:15%;color:#00ffff;font-size:16px;">◇</div>

<div class="shape" style="top:55%;left:10%;color:#ffd800;font-size:14px;">✦</div>

<div class="container">

<div class="logo">

</body>
</html>
